name: build
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY" /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch AI brains into the app
        run: |
          set -e
          mkdir -p app/src/main/assets/models /tmp/m
          B=https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models
          get() { curl -sfL "$B/$1" -o /tmp/m/z.zip && unzip -qo /tmp/m/z.zip -d /tmp/m/x && rm /tmp/m/z.zip; }
          get lama_dilated/releases/v0.63.0/lama_dilated-tflite-float.zip
          get mobilesam/releases/v0.63.0/mobilesam-tflite-float.zip
          get real_esrgan_x4plus/releases/v0.63.0/real_esrgan_x4plus-tflite-float.zip
          cp "$(find /tmp/m/x -name lama_dilated.tflite)" app/src/main/assets/models/lama.tflite
          cp "$(find /tmp/m/x -name encoder.tflite)" app/src/main/assets/models/sam_encoder.tflite
          cp "$(find /tmp/m/x -name decoder.tflite)" app/src/main/assets/models/sam_decoder.tflite
          cp "$(find /tmp/m/x -name real_esrgan_x4plus.tflite)" app/src/main/assets/models/esrgan_x4.tflite
          curl -sfL https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float32/latest/efficientdet_lite2.tflite -o app/src/main/assets/models/objects.tflite
          ls -la app/src/main/assets/models
      - name: Build and test
        run: |
          set +e
          ./gradlew :core:imaging:test :app:testDebugUnitTest :app:assembleRelease --stacktrace --no-daemon > build.log 2>&1
          echo $? > status.txt
          exit 0
      - name: Collect results
        run: |
          mkdir -p out
          cp status.txt out/
          tail -n 400 build.log > out/build-tail.log
          grep -nE "^e: |error:|FAILED|What went wrong" -A 6 build.log | head -n 300 > out/errors.log || true
          for f in $(find . -path "*/test-results/*" -name "*.xml"); do grep -ho 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"; done > out/tests.txt || true
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then cp "$APK" out/NanoGone-debug.apk; ls -la "$APK" > out/apk.txt; fi
          echo "${GITHUB_SHA}" > out/commit.txt
      - name: Enable KVM
        if: hashFiles('out/NanoGone-debug.apk') != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          pip install -q pillow
      - name: Smoke test on an emulator
        id: smoke
        if: hashFiles('out/NanoGone-debug.apk') != ''
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: ./tools/smoke.sh
      - name: Publish results branch
        if: always()
        run: |
          echo "smoke: ${{ steps.smoke.outcome }}" > out/smoke-outcome.txt
          df -h / >> out/smoke-outcome.txt
          mkdir -p /tmp/apk && mv out/NanoGone-debug.apk /tmp/apk/ 2>/dev/null || true
          cd out
          git init -q -b ci-results
          git config user.email "ci@nanogone"
          git config user.name "nanogone-ci"
          git add -A
          git commit -qm "build ${GITHUB_SHA} status $(cat status.txt)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results:ci-results
      - name: Publish APK release
        if: hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          cp app/build/outputs/apk/release/app-release.apk /tmp/NanoGone-debug.apk
          gh release create debug-latest /tmp/NanoGone-debug.apk --title "NanoGone debug (latest)" --notes "Built from ${GITHUB_SHA}. On your phone: open this page, tap NanoGone-debug.apk, allow installing from this source." --prerelease
