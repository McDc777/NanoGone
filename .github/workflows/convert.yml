name: convert-brains
# Deep brain (OSOR-SDXL) to phone files on one 7 GB GitHub machine, one step per process:
# merge the LoRA, then each part with only its own weights, then the picture coder, then a whole-chain
# check against PyTorch. A progress report goes to the branch ci-results-convert-run after every part.
on:
  push:
    branches: [main]
    paths: ["tools/convert/osor_stage.py", "tools/convert/osor_parts.py", "tools/convert/room.sh", ".github/workflows/convert.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: convert
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Room to work
        run: mkdir -p out && bash tools/convert/room.sh 25 2>&1 | tee out/room.txt
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Tools
        run: |
          pip install -q torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q litert-torch==0.9.4 ai-edge-litert==2.2.0 diffusers==0.40.0 transformers==5.18.0 safetensors==0.8.0 huggingface_hub==1.33.0 scikit-image pillow
      - name: Fetch sources
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download, hf_hub_download
          snapshot_download("diffusers/stable-diffusion-xl-1.0-inpainting-0.1", local_dir="/mnt/w/base", allow_patterns=[
              "unet/config.json", "unet/diffusion_pytorch_model.fp16.safetensors",
              "text_encoder/config.json", "text_encoder/model.fp16.safetensors",
              "text_encoder_2/config.json", "text_encoder_2/model.fp16.safetensors",
              "tokenizer/*", "tokenizer_2/*", "scheduler/*", "model_index.json"])
          snapshot_download("madebyollin/sdxl-vae-fp16-fix", local_dir="/mnt/w/vae", allow_patterns=["config.json", "diffusion_pytorch_model.safetensors"])
          hf_hub_download("QinmingZhou/OSOR", "osor-sdxlinpainting/weights/sdxlinpainting_phase2.pth", local_dir="/mnt/w/osor")
          PY
          du -sh /mnt/w/base /mnt/w/vae /mnt/w/osor | tee out/sources.txt
      - name: Merge, then free the sources
        run: |
          S=tools/convert/osor_stage.py
          python -u $S merge /mnt/w/base /mnt/w/osor/osor-sdxlinpainting/weights/sdxlinpainting_phase2.pth /mnt/w/work 2>&1 | grep -v "^W1\|^I0" | tee out/convert.log
          rm -rf /mnt/w/base /mnt/w/osor
          python -u $S prep /mnt/w/work /mnt/w/vae 2>&1 | grep -v "^W1\|^I0" | tee -a out/convert.log
          bash tools/convert/publish.sh run
      - name: Parts, one process each
        run: |
          S=tools/convert/osor_stage.py
          N=$(python -c "import json;print(json.load(open('/mnt/w/work/count.json'))['count'])")
          for i in $(seq 0 $((N - 1))); do
            python -u $S part $i /mnt/w/work /mnt/w/parts 2>&1 | grep -v "^W1\|^I0" | tee -a out/convert.log
            test -f /mnt/w/parts/osor_unet_$i.json
            free -g | sed -n 2,3p | tee -a out/convert.log
            bash tools/convert/publish.sh run
          done
      - name: Picture coder and whole-chain check
        run: |
          S=tools/convert/osor_stage.py
          python -u $S vae /mnt/w/vae /mnt/w/parts 2>&1 | grep -v "^W1\|^I0" | tee -a out/convert.log
          python -u $S finish /mnt/w/work /mnt/w/vae /mnt/w/parts /mnt/w/final 2>&1 | grep -v "^W1\|^I0" | tee -a out/convert.log
          cp /mnt/w/final/*.png /mnt/w/final/brains.json out/
      - name: Attach to brains-v1
        run: |
          gh release view brains-v1 >/dev/null 2>&1 || gh release create brains-v1 --title "NanoGone brains v1" --notes "AI brain files for NanoGone." --prerelease
          for f in /mnt/w/parts/osor_*.tflite /mnt/w/final/brains.json; do
            for t in 1 2 3; do gh release upload brains-v1 "$f" --clobber 2>&1 | tee -a out/upload.log && break; sleep 20; done
          done
          gh release view brains-v1 --json assets --jq '.assets[] | "\(.name) \(.size)"' | tee out/release.txt
          gh release delete brains-work --yes --cleanup-tag >/dev/null 2>&1 || true
      - name: Publish results
        if: always()
        run: bash tools/convert/publish.sh run
