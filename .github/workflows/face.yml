name: convert-face-fix
# Quick job: GFPGAN v1.4 to phone format, attached to the brains-v1 release (the APK build picks it up).
on:
  push:
    branches: [main]
    paths: ["tools/convert/convert_gfpgan.py", "tools/convert/gfpgan_arch/**", ".github/workflows/face.yml"]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  face:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Convert
        run: |
          pip install -q torch==2.13.0 torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q litert-torch==0.9.4 ai-edge-litert==2.2.0
          mkdir -p out
          curl -sfL -o /tmp/GFPGANv1.4.pth https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth
          python -u tools/convert/convert_gfpgan.py /tmp/GFPGANv1.4.pth /tmp/gfpgan.tflite 2>&1 | grep -v "^W1\|^I0" | tail -5 | tee out/gfpgan.log
      - name: Attach to brains-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view brains-v1 >/dev/null 2>&1 || gh release create brains-v1 --title "NanoGone brains v1" --notes "AI brain files for NanoGone." --prerelease
          gh release upload brains-v1 /tmp/gfpgan.tflite --clobber
          gh release view brains-v1 --json assets --jq '.assets[] | "\(.name) \(.size)"' | tee out/release.txt
      - name: Publish
        if: always()
        run: |
          echo "${GITHUB_SHA}" > out/commit.txt; echo "${{ job.status }}" > out/status.txt
          cd out && git init -q -b r && git config user.email ci@nanogone && git config user.name nanogone-ci
          git add -A && git commit -qm face && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" r:ci-results-face
