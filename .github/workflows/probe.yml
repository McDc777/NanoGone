name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: LiteRT artifacts
        run: |
          mkdir -p out && cd out
          g=https://dl.google.com/dl/android/maven2/com/google/ai/edge/litert
          curl -s $g/group-index.xml > group-index.xml
          for a in litert litert-gpu litert-gpu-api litert-support litert-api; do echo "$a: $(curl -s $g/$a/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -6 | tr '\n' ' ')"; done > versions.txt
          curl -sfo l.aar $g/litert/2.2.0/litert-2.2.0.aar && unzip -qo l.aar -d l && unzip -qo l/classes.jar -d lc && find lc -path "*gpu*" -name "*.class" | head -30 > gpu-classes.txt; ls l/jni/arm64-v8a > jni.txt 2>&1
          curl -s $g/litert/2.2.0/litert-2.2.0.pom > litert.pom
          rm -rf l lc l.aar
      - name: Publish
        run: |
          cd out
          git init -q -b p && git config user.email ci@nanogone && git config user.name nanogone-ci
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" p:ci-results-probe
