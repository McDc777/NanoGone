name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: LiteRT CompiledModel API
        continue-on-error: true
        run: |
          set +e
          mkdir -p out && cd out
          g=https://dl.google.com/dl/android/maven2/com/google/ai/edge/litert
          for a in litert litert-api; do
            curl -sfo $a.aar $g/$a/2.2.0/$a-2.2.0.aar; mkdir -p x-$a; unzip -qo $a.aar -d x-$a; unzip -qo x-$a/classes.jar -d c-$a
          done
          find c-litert c-litert-api -name "*.class" > all-classes.txt
          for d in c-litert c-litert-api; do
            for f in $(find $d -name "*.class" | grep -E "/(CompiledModel|Accelerator|TensorBuffer|Environment|Model|LiteRtException|Options)(\.class|\\\$Options\.class)$"); do
              c=$(echo ${f#$d/} | sed 's/\.class$//; s#/#.#g')
              echo "== $c"; javap -cp $d "$c"
            done
          done > compiled-api.txt 2>&1
          rm -rf x-* c-* *.aar
      - name: Publish
        if: always()
        run: |
          cd out
          git init -q -b p && git config user.email ci@nanogone && git config user.name nanogone-ci
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" p:ci-results-probe
