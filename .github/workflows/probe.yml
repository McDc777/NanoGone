name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Qualcomm model catalogue
        continue-on-error: true
        run: |
          set +e
          mkdir -p out && cd out
          curl -s "https://huggingface.co/api/models?author=qualcomm&limit=500" | python3 -c "import json,sys; [print(m['id']) for m in json.load(sys.stdin)]" | sort > qualcomm-models.txt
          for r in EasyOCR DeepLabV3-Plus-MobileNet Mask2Former DETR-ResNet50 RTMDet Yolo-NAS FastSam-S PaddleOCR Face-Det-Lite MediaPipe-Face-Detection GFPGAN; do
            echo "== $r" >> picks.txt
            curl -sL "https://huggingface.co/qualcomm/$r/raw/main/release_assets.json" | grep -E '"download_url"|tflite' | head -6 >> picks.txt
            curl -sL "https://huggingface.co/qualcomm/$r/raw/main/LICENSE" | head -3 >> picks.txt
          done
      - name: Library versions
        continue-on-error: true
        run: |
          cd out
          g=https://dl.google.com/dl/android/maven2
          for a in com/google/mlkit/text-recognition com/google/mediapipe/tasks-vision com/google/mlkit/object-detection; do
            echo "$a: $(curl -s $g/$a/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -4 | tr '\n' ' ')"
          done > versions.txt
          for m in efficientdet_lite2/float32/latest/efficientdet_lite2.tflite efficientdet_lite0/float32/latest/efficientdet_lite0.tflite; do
            echo "$m $(curl -s -o /dev/null -w '%{http_code} %{size_download}' https://storage.googleapis.com/mediapipe-models/object_detector/$m)"
          done >> versions.txt
      - name: Publish
        if: always()
        run: |
          cd out
          git init -q -b p && git config user.email ci@nanogone && git config user.name nanogone-ci
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" p:ci-results-probe
