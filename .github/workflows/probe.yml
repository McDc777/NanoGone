name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Look up model download links
        run: |
          mkdir -p out && cd out
          for r in qualcomm/LaMa-Dilated qualcomm/Segment-Anything-Model-2 qualcomm/MobileSam qualcomm/EfficientSAM qualcomm/Real-ESRGAN-x4plus qualcomm/AOT-GAN; do
            echo "== $r" >> assets.txt
            curl -sL "https://huggingface.co/$r/raw/main/release_assets.json" >> assets.txt
            echo >> assets.txt
          done
          grep -n -iE "input|output|resolution|precision|tflite|onnx|ms|download" qualcomm_LaMa-Dilated.README.md 2>/dev/null | head -5 || true
          curl -sL "https://huggingface.co/qualcomm/LaMa-Dilated/raw/main/README.md" > lama.md
          curl -sL "https://huggingface.co/qualcomm/Segment-Anything-Model-2/raw/main/README.md" > sam2.md
          curl -s "https://huggingface.co/api/models?author=qualcomm&search=sam&limit=50" | python3 -c "import json,sys; [print(m['id']) for m in json.load(sys.stdin)]" > qualcomm-sam.txt
          curl -s "https://huggingface.co/api/models?search=lama&limit=40&sort=downloads" | python3 -c "import json,sys; [print(m['id']) for m in json.load(sys.stdin)]" > lama-search.txt
      - name: Publish
        run: |
          cd out
          git init -q -b p && git config user.email ci@nanogone && git config user.name nanogone-ci
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" p:ci-results-probe
