name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: LiteRT options API
        continue-on-error: true
        run: |
          set +e
          mkdir -p out && cd out
          g=https://dl.google.com/dl/android/maven2/com/google/ai/edge/litert
          curl -sfo a.aar $g/litert-api/2.2.0/litert-api-2.2.0.aar; unzip -qo a.aar -d x; unzip -qo x/classes.jar -d c
          curl -sfo b.aar $g/litert/2.2.0/litert-2.2.0.aar; unzip -qo b.aar -d y; unzip -qo y/classes.jar -d c
          for k in 'CompiledModel$CpuOptions' 'CompiledModel$CpuOptions$Key' 'CompiledModel$GpuOptions' 'CompiledModel$GpuOptions$Precision' 'CompiledModel$QualcommOptions' 'CompiledModel$QualcommOptions$HtpPerformanceMode' 'Environment$Option' 'BuiltinNpuAcceleratorProvider' 'NpuAcceleratorProvider' 'NpuCompatibilityChecker' 'NpuCompatibilityChecker$Companion'; do
            echo "== $k"; javap -cp c "com.google.ai.edge.litert.$k"
          done > options-api.txt 2>&1
          ls y/jni/arm64-v8a >> options-api.txt
          rm -rf x y c *.aar
      - name: Publish
        if: always()
        run: |
          cd out
          git init -q -b p && git config user.email ci@nanogone && git config user.name nanogone-ci
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" p:ci-results-probe
